# Render Blueprint: one web service (API + built web app, same origin) and one PostgreSQL database.
# See DEPLOY.md. Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: cellar
    runtime: node
    region: frankfurt
    # Free while testing: sleeps when idle. Switch to a paid plan before the public launch (DEPLOY.md).
    plan: free
    # NODE_ENV=production also applies to the build, so dev dependencies (Vite, TypeScript) are included explicitly.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cellar-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Version of the published Terms of use / Privacy notice (recorded on each user at sign-up).
      - key: TERMS_VERSION
        value: "2026-10-24"

databases:
  - name: cellar-db
    region: frankfurt
    # Free databases are DELETED after 30 days. Upgrade before real users store data (DEPLOY.md).
    plan: free
    databaseName: cellar
    user: cellar
